<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Random Joke Fetcher</title>
    <style>
      :root {
        --bg: #f7f7fb;
        --surface: #ffffff;
        --surface-2: #f1f1f7;
        --ink: #17161f;
        --muted: #5d5c6b;
        --line: #e4e3ee;
        --accent: #4f46e5;
        --accent-strong: #3f37c9;
        --accent-soft: #eef0ff;
        --shadow: 0 10px 30px -12px rgba(23, 22, 31, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111117;
          --surface: #1a1a22;
          --surface-2: #22222c;
          --ink: #ececf3;
          --muted: #a5a4b4;
          --line: #2d2c39;
          --accent: #a5b4fc;
          --accent-strong: #c7d0ff;
          --accent-soft: #252545;
          --shadow: 0 12px 30px -14px rgba(0, 0, 0, 0.7);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 48px 18px;
        background: var(--bg);
        color: var(--ink);
        font: 16.5px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: clamp(30px, 6vw, 40px);
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
      }
      main > p {
        color: var(--muted);
        margin: 0 0 24px;
      }
      h2 {
        font-size: 1.25rem;
        letter-spacing: -0.01em;
        margin: 36px 0 12px;
      }
      .box {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 24px;
      }
      #setup {
        font-size: 1.3rem;
        font-weight: 700;
        margin: 0 0 10px;
      }
      #punch {
        margin: 0;
        font-size: 1.15rem;
        background: var(--accent-soft);
        color: var(--ink);
        border-radius: 8px;
        display: inline-block;
        padding: 4px 10px;
      }
      #punch:empty {
        display: none;
      }
      #status {
        margin: 0;
        color: var(--muted);
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      button {
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 9px;
        padding: 10px 18px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      button:hover:not(:disabled) {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
      }
      button.alt {
        background: var(--surface);
        color: var(--ink);
        border-color: var(--line);
      }
      button.alt:hover:not(:disabled) {
        background: var(--surface-2);
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: dark) {
        button { color: #14141c; }
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }
      li {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        align-items: flex-start;
      }
      li small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
      }
      li button {
        padding: 4px 10px;
        font-size: 0.85rem;
        background: var(--surface);
        color: var(--ink);
        border-color: var(--line);
      }
      li button:hover:not(:disabled) {
        background: var(--surface-2);
        border-color: var(--accent);
      }
      #none {
        color: var(--muted);
      }
      .err {
        color: #c0262d;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Random Joke Fetcher</h1>
      <p>
        Pull a fresh joke from the internet and keep the ones that made you
        groan.
      </p>
      <section class="box" aria-live="polite">
        <p id="status">Press "Load Joke" to get a joke.</p>
        <p id="setup" hidden></p>
        <p id="punch" hidden></p>
        <div class="row">
          <button id="load">Load Joke</button>
          <button id="save" class="alt" disabled>Save Favourite</button>
        </div>
      </section>
      <h2>Favourite jokes</h2>
      <ul id="favs"></ul>
      <p id="none">No favourites saved yet.</p>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let current = null,
        favs = [];
      try {
        favs = JSON.parse(localStorage.getItem("jokeFavs") || "[]");
      } catch (e) {}

      async function getJoke() {
        try {
          const r = await fetch(
            "https://official-joke-api.appspot.com/random_joke",
          );
          if (!r.ok) throw new Error("HTTP " + r.status);
          const d = await r.json();
          return { setup: d.setup, punchline: d.punchline };
        } catch (e) {
          const r = await fetch(
            "https://v2.jokeapi.dev/joke/Programming?safe-mode",
          );
          if (!r.ok) throw new Error("HTTP " + r.status);
          const d = await r.json();
          if (d.error) throw new Error(d.message || "API error");
          return d.type === "single"
            ? { setup: d.joke, punchline: "" }
            : { setup: d.setup, punchline: d.delivery };
        }
      }

      async function load() {
        $("load").disabled = true;
        $("save").disabled = true;
        $("status").className = "";
        $("status").textContent = "Loading…";
        $("status").hidden = false;
        try {
          current = await getJoke();
          $("setup").textContent = current.setup;
          $("punch").textContent = current.punchline;
          $("setup").hidden = false;
          $("punch").hidden = !current.punchline;
          $("status").hidden = true;
          $("save").disabled = false;
        } catch (e) {
          $("setup").hidden = $("punch").hidden = true;
          $("status").className = "err";
          $("status").textContent =
            "Could not load a joke (" +
            e.message +
            "). Check your connection and try again.";
        }
        $("load").disabled = false;
      }

      function renderFavs() {
        $("favs").innerHTML = "";
        $("none").hidden = favs.length > 0;
        favs.forEach((j, i) => {
          const li = document.createElement("li");
          const t = document.createElement("div");
          t.textContent = j.setup;
          if (j.punchline) {
            const s = document.createElement("small");
            s.textContent = j.punchline;
            t.appendChild(s);
          }
          const b = document.createElement("button");
          b.textContent = "Remove";
          b.onclick = () => {
            favs.splice(i, 1);
            persist();
          };
          li.append(t, b);
          $("favs").appendChild(li);
        });
      }
      function persist() {
        try {
          localStorage.setItem("jokeFavs", JSON.stringify(favs));
        } catch (e) {}
        renderFavs();
      }

      $("load").onclick = load;
      $("save").onclick = () => {
        if (!current) return;
        if (
          !favs.some(
            (f) =>
              f.setup === current.setup && f.punchline === current.punchline,
          )
        )
          favs.push(current);
        persist();
      };
      renderFavs();
    </script>
  <script src="../assets/site.js" defer></script>
</body>
</html>
