<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Country Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef2f7;
        --ink: #14213d;
        --mute: #5b6a82;
        --line: #d5dce7;
        --blue: #2457c5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 "IBM Plex Sans",
          system-ui,
          sans-serif;
        padding: 28px clamp(12px, 4vw, 48px);
      }
      h1 {
        margin: 0;
        font-size: 2rem;
      }
      .sub {
        color: var(--mute);
        max-width: 70ch;
        margin: 6px 0 18px;
        font-size: 0.88rem;
      }
      form {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: end;
        margin-bottom: 12px;
      }
      label {
        display: grid;
        gap: 3px;
        font-size: 0.82rem;
        font-weight: 500;
      }
      input,
      select {
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        min-width: 190px;
      }
      button.go {
        font: inherit;
        font-weight: 600;
        background: var(--blue);
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 9px 20px;
        cursor: pointer;
      }
      input:focus-visible,
      select:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      #count {
        color: var(--mute);
        font-size: 0.85rem;
        margin: 0 0 8px;
      }
      .scroll {
        overflow: auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        max-height: 72vh;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 720px;
      }
      th,
      td {
        padding: 8px 14px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th {
        position: sticky;
        top: 0;
        background: #f7f9fc;
        font-weight: 600;
        font-size: 0.85rem;
      }
      th button {
        all: unset;
        cursor: pointer;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      th button:focus-visible {
        outline: 2px solid var(--blue);
      }
      th .ar {
        color: var(--blue);
        width: 1em;
      }
      td.n {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      th.n {
        text-align: right;
      }
      th.n button {
        justify-content: flex-end;
      }
      tbody tr:hover {
        background: #f2f6fd;
      }
      td img {
        width: 32px;
        height: 22px;
        object-fit: cover;
        border: 1px solid var(--line);
        border-radius: 2px;
        display: block;
      }
      .empty {
        padding: 24px;
        color: var(--mute);
      }
    </style>
  </head>
  <body>
    <h1>Country Table</h1>
    <p class="sub">
      Country data comes from the world-countries dataset (via jsDelivr), flags
      from flagcdn.com and population from the World Bank API. Click a column
      heading to sort.
    </p>
    <form id="f">
      <label
        >Name<input
          id="name"
          placeholder="Search by country name"
          autocomplete="off"
      /></label>
      <label
        >Region<select id="region">
          <option value="">All regions</option>
        </select></label
      >
      <button class="go">Search</button>
    </form>
    <p id="count" aria-live="polite">Loading countries…</p>
    <div class="scroll">
      <table>
        <thead>
          <tr id="head"></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <script>
      const COLS = [
        ["flag", "Flag", 0],
        ["name", "Country", 0],
        ["capital", "Capital", 0],
        ["region", "Region", 0],
        ["pop", "Population", 1],
        ["area", "Area (km²)", 1],
      ];
      const $ = (id) => document.getElementById(id);
      let all = [],
        view = [],
        sort = { key: "name", dir: 1 };

      COLS.forEach(([k, label, num]) => {
        const th = document.createElement("th");
        if (num) th.className = "n";
        if (k === "flag") th.textContent = label;
        else {
          th.innerHTML = `<button type="button">${label}<span class="ar"></span></button>`;
          th.firstChild.onclick = () => {
            sort = { key: k, dir: sort.key === k ? -sort.dir : 1 };
            draw();
          };
          th.dataset.k = k;
        }
        $("head").appendChild(th);
      });

      async function load() {
        try {
          const [cr, pr] = await Promise.all([
            fetch(
              "https://cdn.jsdelivr.net/npm/world-countries@5/countries.json",
            ),
            fetch(
              "https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?format=json&per_page=400&mrnev=1",
            ),
          ]);
          if (!cr.ok) throw new Error("countries HTTP " + cr.status);
          const countries = await cr.json();
          const pop = {};
          try {
            if (pr.ok)
              (await pr.json())[1].forEach((x) => {
                if (x.value) pop[x.countryiso3code] = x.value;
              });
          } catch (e) {}
          all = countries.map((c) => ({
            flag: (c.cca2 || "").toLowerCase(),
            name: c.name.common,
            official: c.name.official,
            capital: (c.capital || [])[0] || "—",
            region: c.region || "Other",
            pop: pop[c.cca3] ?? null,
            area: c.area ?? null,
          }));
          [...new Set(all.map((c) => c.region))]
            .filter(Boolean)
            .sort()
            .forEach((r) => $("region").add(new Option(r, r)));
          filter();
        } catch (e) {
          $("count").textContent =
            "Could not load country data (" +
            e.message +
            "). Check your connection and reload.";
        }
      }
      function filter() {
        const q = $("name").value.trim().toLowerCase(),
          r = $("region").value;
        view = all.filter(
          (c) =>
            (!r || c.region === r) &&
            (!q ||
              c.name.toLowerCase().includes(q) ||
              c.official.toLowerCase().includes(q)),
        );
        draw();
      }
      function draw() {
        const { key, dir } = sort;
        view.sort((a, b) => {
          const x = a[key],
            y = b[key];
          if (x == null) return 1;
          if (y == null) return -1;
          return (
            (typeof x === "number"
              ? x - y
              : String(x).localeCompare(String(y))) * dir
          );
        });
        document.querySelectorAll("th[data-k]").forEach((th) => {
          th.querySelector(".ar").textContent =
            th.dataset.k === key ? (dir > 0 ? "▲" : "▼") : "";
          th.setAttribute(
            "aria-sort",
            th.dataset.k === key
              ? dir > 0
                ? "ascending"
                : "descending"
              : "none",
          );
        });
        $("count").textContent = `${view.length} of ${all.length} countries`;
        const f = (n) => (n == null ? "—" : Math.round(n).toLocaleString());
        $("rows").innerHTML = view.length
          ? view
              .map(
                (c) => `<tr>
    <td>${c.flag ? `<img loading="lazy" src="https://flagcdn.com/w40/${c.flag}.png" alt="Flag of ${c.name.replace(/"/g, "")}">` : ""}</td>
    <td>${c.name}</td><td>${c.capital}</td><td>${c.region}</td><td class="n">${f(c.pop)}</td><td class="n">${f(c.area)}</td></tr>`,
              )
              .join("")
          : '<tr><td colspan="6" class="empty">No countries match. Try a shorter name or another region.</td></tr>';
      }
      $("f").onsubmit = (e) => {
        e.preventDefault();
        filter();
      };
      $("region").onchange = filter;
      load();
    </script>
  </body>
</html>
