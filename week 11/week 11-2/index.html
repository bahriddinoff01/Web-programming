<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 11-2</title>

    <style>
        :root {
            --ink: #14121f;
            --bg: #f3f3fa;
            --tint: #b5f0d0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Trebuchet MS", Verdana, sans-serif;
            color: var(--ink);
            background-color: var(--bg);
            background-image: radial-gradient(#c9c9de 1.5px, transparent 1.5px);
            background-size: 22px 22px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px;
        }

        header {
            padding: 72px 0 48px;
        }

        h1 {
            margin: 0;
            font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
            font-weight: 900;
            font-size: clamp(32px, 7vw, 60px);
            line-height: 1.05;
        }

        .panel {
            padding: 28px 24px;
            background: var(--tint);
            border: 3px solid var(--ink);
            box-shadow: 6px 6px 0 var(--ink);
            font-size: 18px;
        }

        .panel p {
            margin: 0;
        }

        .back {
            display: inline-block;
            margin-top: 32px;
            padding: 10px 18px;
            color: var(--ink);
            background: #fff;
            border: 3px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.12s, box-shadow 0.12s;
        }

        .back:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--ink);
        }

        .back:focus-visible {
            outline: 4px solid var(--ink);
            outline-offset: 4px;
        }

        footer {
            margin-top: 48px;
            padding: 20px 0 32px;
            border-top: 3px solid var(--ink);
            font-size: 14px;
        }

        @media (max-width: 760px) {
            header {
                padding: 48px 0 32px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .back {
                transition: none;
            }

            .back:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Week 11-2</h1>
        </header>

        <main>
            <div class="panel">
                <p>Assignments for this part will be added here.</p>
            </div>

            <a class="back" href="../../main%20container/Week11.html">&larr; Back to Week 11</a>
        </main>

        <footer>Abdulazizbek &middot; ID 202537225 &middot; Computer Engineering</footer>
    </div>
</body>
</html>
