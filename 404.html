<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This page could not be found on Abdulazizbek's Web Programming site.">
    <meta name="robots" content="noindex">
    <title>404 - Page Not Found | Web Programming</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111111'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='11' fill='%23ffffff'%3E404%3C/text%3E%3C/svg%3E">

    <!--
        GitHub Pages shows this file for any address that doesn't exist,
        at that broken address. So every link here is a full URL:
        relative links like ./Main.html would point to the wrong place.
    -->

    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --muted: #555555;
            --line: #e2e2e2;
            --soft: #f6f6f6;
            --accent: #1d4ed8;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111111;
                --text: #eeeeee;
                --muted: #a8a8a8;
                --line: #2e2e2e;
                --soft: #1b1b1b;
                --accent: #8ab4ff;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 17px;
            line-height: 1.65;
            color: var(--text);
            background: var(--bg);
        }

        .wrap {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 clamp(20px, 4vw, 48px);
        }

        a {
            color: var(--accent);
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        /* header */

        .site-header {
            border-bottom: 1px solid var(--line);
        }

        .site-header .wrap {
            padding-top: 14px;
            padding-bottom: 14px;
        }

        .logo {
            color: var(--text);
            font-weight: 700;
            text-decoration: none;
        }

        /* main */

        main {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .content {
            padding-top: 72px;
            padding-bottom: 72px;
        }

        .code {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: clamp(72px, 16vw, 140px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 4.5vw, 40px);
            line-height: 1.2;
        }

        .message {
            margin: 0 0 8px;
            max-width: 40em;
            font-size: 19px;
        }

        .path {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 15px;
            overflow-wrap: anywhere;
        }

        .path code {
            padding: 1px 6px;
            background: var(--soft);
            border: 1px solid var(--line);
            border-radius: 4px;
            font-family: Consolas, Monaco, monospace;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 0 0 36px;
            padding: 0;
            list-style: none;
        }

        .btn {
            display: inline-block;
            padding: 9px 18px;
            border: 1px solid var(--text);
            border-radius: 6px;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        .btn.primary {
            background: var(--text);
            color: var(--bg);
        }

        .btn:hover {
            opacity: 0.8;
        }

        .suggest h2 {
            margin: 0 0 8px;
            font-size: 15px;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .suggest ul {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        /* footer */

        .site-footer {
            padding: 24px 0 32px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 14px;
        }

        .site-footer p {
            margin: 0;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="wrap">
            <a class="logo" href="https://bahriddinoff01.github.io/Web-programming/main%20container/Main.html">Web Programming</a>
        </div>
    </header>

    <main>
        <div class="wrap content">
            <p class="code" aria-hidden="true">404</p>
            <h1>Page not found</h1>
            <p class="message" id="message">This page doesn't exist, or it has been moved.</p>
            <p class="path" id="path" hidden>You tried to open <code id="path-text"></code></p>

            <ul class="actions">
                <li><a class="btn primary" href="https://bahriddinoff01.github.io/Web-programming/main%20container/Main.html">Go to homepage</a></li>
                <li><button class="btn" type="button" id="back">Go back</button></li>
            </ul>

            <nav class="suggest" aria-labelledby="suggest-title">
                <h2 id="suggest-title">Maybe you were looking for</h2>
                <ul>
                    <li><a href="https://bahriddinoff01.github.io/Web-programming/main%20container/Week10.html">Week 10: Git &amp; GitHub</a></li>
                    <li><a href="https://bahriddinoff01.github.io/Web-programming/week%2010/week%2010-2/index.html">My portfolio</a></li>
                    <li><a href="https://bahriddinoff01.github.io/Web-programming/main%20container/Week9.html">Week 9: Accessibility</a></li>
                    <li><a href="https://bahriddinoff01.github.io/Web-programming/main%20container/TeamFiles.html">Team files</a></li>
                </ul>
            </nav>
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <p>Abdulazizbek &middot; ID 202537225 &middot; Computer Engineering</p>
        </div>
    </footer>

    <script>
        // Pick a friendly message at random.
        const messages = [
            "This page doesn't exist, or it has been moved.",
            "Looks like this page took a day off.",
            "We searched every folder. Nothing here.",
            "git checkout this-page failed: branch not found.",
            "This link is broken, but the rest of the site works."
        ];
        document.getElementById("message").textContent =
            messages[Math.floor(Math.random() * messages.length)];

        // Show the address the visitor tried to open.
        const path = decodeURIComponent(location.pathname);
        if (!path.endsWith("/404.html")) {
            document.getElementById("path-text").textContent = path;
            document.getElementById("path").hidden = false;
        }

        // "Go back" returns to the previous page, or the homepage if there isn't one.
        document.getElementById("back").addEventListener("click", function () {
            if (history.length > 1) {
                history.back();
            } else {
                location.href = "https://bahriddinoff01.github.io/Web-programming/main%20container/Main.html";
            }
        });
    </script>
</body>
</html>
